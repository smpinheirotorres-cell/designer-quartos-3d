 master.connect(AC.destination);master.connect(dly);dly.connect(fb);fb.connect(dly);dly.connect(wet);wet.connect(AC.destination);
 chillOn=true;barN=0;liveLoops=[];if(T.init)T.init();tick();chillTimer=setInterval(tick,T.len*1000);playBtn.textContent='Ⅱ A tocar';showDesc()}
async function toggleChill(){if(chillOn){stopChill();return}if(musicSelect.value==='off')return;if(AC&&AC.state==='suspended')await AC.resume();startChill();if(AC.state==='suspended')await AC.resume()}
function stopChill(){chillOn=false;clearInterval(chillTimer);chillTimer=null;const m=master,loops=liveLoops;master=null;liveLoops=[];if(m&&AC){m.gain.cancelScheduledValues(AC.currentTime);m.gain.setTargetAtTime(0,AC.currentTime,.12);setTimeout(()=>{loops.forEach(s=>{try{s.stop()}catch(e){}});try{m.disconnect()}catch(e){}},900)}playBtn.textContent='▶ Reproduzir';showDesc()}
musicSelect.onchange=()=>{const was=chillOn;if(was)stopChill();showDesc();if(was&&musicSelect.value!=='off')setTimeout(startChill,60)};

let PA=null,petSnd=true,fps=[],fpT=0,ptBuf=null;
function unlockPA(){try{if(!PA)PA=new(window.AudioContext||window.webkitAudioContext)();if(PA.state==='suspended')PA.resume()}catch(e){}}
['pointerdown','touchstart','keydown'].forEach(ev=>addEventListener(ev,unlockPA,{passive:true}));
function ptEnv(t,d,v){const g=PA.createGain();g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);g.connect(PA.destination);return g}
function ptOsc(type,t,f0,f1,d,v,fl){const o=PA.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+d);let n=o;if(fl){const f=PA.createBiquadFilter();f.type=fl[0];f.frequency.value=fl[1];f.Q.value=fl[2]||1;o.connect(f);n=f}n.connect(ptEnv(t,d,v));o.start(t);o.stop(t+d+.05)}
function ptNz(t,d,v,ft,fq,q,lfo){if(!ptBuf){ptBuf=PA.createBuffer(1,PA.sampleRate,PA.sampleRate);const a=ptBuf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}
 const s=PA.createBufferSource(),f=PA.createBiquadFilter(),g=ptEnv(t,d,v);s.buffer=ptBuf;s.loop=true;f.type=ft;f.frequency.value=fq;f.Q.value=q||1;s.connect(f);
 if(lfo){const m=PA.createGain();m.gain.value=.5;const l=PA.createOscillator(),lg=PA.createGain();l.frequency.value=lfo;lg.gain.value=.5;l.connect(lg);lg.connect(m.gain);f.connect(m);m.connect(g);l.start(t);l.stop(t+d+.05)}else f.connect(g);s.start(t);s.stop(t+d+.05)}
const SND={
// Sons sintetizados em camadas: mais variação de tom, ruído filtrado e pequenos intervalos.
// São aproximações sonoras; não são gravações reais de animais.
dog(p,soft){const t=PA.currentTime,v=soft?.10:.22;const n=soft?1:(Math.random()<.35?3:2);for(let i=0;i<n;i++){const d=i*(.16+Math.random()*.07),f=rn(300,470)*p;ptOsc('sawtooth',t+d,f,f*rn(.36,.58),.17,v,['lowpass',rn(850,1450)*p]);ptOsc('triangle',t+d, f*.48,f*.24,.13,v*.48,['lowpass',650]);ptNz(t+d,.095,v*.24,'bandpass',rn(650,1150),2)}},
cat(p){const t=PA.currentTime, f=rn(390,510)*p, dur=rn(.32,.48);ptOsc('sawtooth',t,f,f*rn(1.55,2.0),dur*.52,.10,['bandpass',rn(950,1450),3]);ptOsc('triangle',t+dur*.45,f*1.65,f*rn(.72,.95),dur*.7,.09,['bandpass',rn(700,1150),2]);ptOsc('sine',t,f*.5,f*.85,dur*.9,.035,['lowpass',900])},
purr(){const t=PA.currentTime;for(let i=0;i<7;i++){const d=i*.29;ptNz(t+d,.25,.16,'lowpass',rn(130,210),1,rn(22,31));ptOsc('triangle',t+d, rn(24,34),rn(28,39),.22,.045,['lowpass',180])}},
rabbit(){const t=PA.currentTime;ptNz(t,.055,.035,'highpass',rn(2600,3800),1);if(Math.random()<.5)ptOsc('sine',t+.08, rn(1700,2300),rn(1100,1600),.07,.025)},
hamster(){const t=PA.currentTime;for(let i=0;i<3+Math.floor(Math.random()*3);i++){const d=i*rn(.055,.095),f=rn(2800,4300);ptOsc('sine',t+d,f,f*rn(1.08,1.35),rn(.045,.075),.035);ptNz(t+d,.035,.012,'bandpass',rn(3000,5000),1)}},
gpig(){const t=PA.currentTime,f=rn(850,1250);[0,.22,.52].forEach((d,i)=>{ptOsc('triangle',t+d,f*(i===1?1.25:1),f*rn(1.25,1.8),.16,.065,['bandpass',rn(900,1700),2]);ptOsc('sine',t+d+.04,f*1.7,f*1.25,.12,.035)})},
turtle(){const t=PA.currentTime;ptNz(t,.12,.025,'highpass',rn(1800,3000),1)},
bird(){const t=PA.currentTime,notes=3+Math.floor(Math.random()*3);for(let i=0;i<notes;i++){const d=i*rn(.075,.14),f=rn(2100,3600);ptOsc('sine',t+d,f,f*rn(1.25,1.7),rn(.07,.12),.045);if(Math.random()<.55)ptOsc('sine',t+d+.025,f*2,f*2.2,.045,.012)}},
parrot(){const t=PA.currentTime,f=rn(750,1200);[0,.18,.39].forEach((d,i)=>{ptOsc('sawtooth',t+d,f*(i===1?1.25:1),f*rn(.62,1.45),rn(.13,.23),.065,['bandpass',rn(950,1900),3]);ptNz(t+d,.06,.018,'bandpass',rn(1200,2200),2)})},
fish(){const t=PA.currentTime;for(let i=0;i<3;i++){const f=rn(260,430)+i*65;ptOsc('sine',t+i*.13,f,f*rn(1.5,2.2),.12,.04);}}
};
function voice(g,happy){if(!petSnd||!PA||PA.state!=='running')return;const p=g.userData.pet;if(!p)return;try{
 if(p.snd==='cat'){if(happy){SND.purr();if(Math.random()<.5)setTimeout(()=>SND.cat(p.pitch),500)}else SND.cat(p.pitch)}
 else if(p.snd==='dog')SND.dog(p.pitch,happy&&Math.random()<.5);else SND[p.snd](p.pitch)}catch(e){}}
const fxv=new THREE.Vector3();
function pfx(g,txt,n){const p=g.userData.pet;for(let i=0;i<(n||1);i++)setTimeout(()=>{g.getWorldPosition(fxv);fxv.y+=(p.fxH||(p.s||1)*.5);fxv.project(cam);const e=document.createElement('span');e.className='pfx';e.textContent=txt;e.style.left=((fxv.x+1)/2*cv.clientWidth+rn(-18,18))+'px';e.style.top=((1-fxv.y)/2*cv.clientHeight)+'px';cv.appendChild(e);setTimeout(()=>e.remove(),1400)},i*220)}
function petIt(g){const p=g&&g.userData.pet;if(!p)return;p.love=2.8;if(p.mode==='sleep'){p.mode='idle';p.lift=0}p.toBed=false;pfx(g,p.fxE||'❤️',3);voice(g,true)}
function inFp(x,z,m){return fps.some(f=>x>f[0]-m&&x<f[1]+m&&z>f[2]-m&&z<f[3]+m)}
function blockedAt(g,x,z){const m=g.userData.pet.L*.3;return inFp(x,z,m)&&!inFp(g.position.x,g.position.z,m)}
function rebuildFp(){fps=[];if(!items.some(i=>i.userData.pet))return;items.forEach(o=>{const u=o.userData;if(u.pet||u.wall!=null||(CAT[u.name]&&CAT[u.name][0]=='w')||/Tapete|Capacho|Cama de|Taça|Fita|Puf/.test(u.name))return;const b=bbox(o);if(b.max.y-b.min.y<.15||b.min.y>.5)return;fps.push([b.min.x-.05,b.max.x+.05,b.min.z-.05,b.max.z+.05])})}
function bedFor(g){const p=g.userData.pet;if(!p.bedRe)return null;let best=null,bd=1e9;items.forEach(o=>{if(o===g||!p.bedRe.test(o.userData.name))return;const d=Math.hypot(o.position.x-g.position.x,o.position.z-g.position.z);if(d<bd){bd=d;best=o}});return best}
function pose(p,dt,t,moving,gait){const k=Math.min(1,dt*3);p.lie+=((p.mode==='sleep'?1:0)-p.lie)*k;p.liftC+=(p.lift-p.liftC)*Math.min(1,dt*4);
 const base=p.lh*(1-.78*p.lie);let bob=0;
 p.legs.forEach((l,i)=>{l.position.y=base;l.scale.y=Math.max(.12,base/p.lh);const tr=moving?Math.sin(gait+(i==1||i==2?Math.PI:0))*.7:0;l.rotation.z+=(tr-l.rotation.z)*Math.min(1,dt*14)});
 if(moving)bob=p.hop?Math.abs(Math.sin(gait*.7))*.08*p.s:Math.abs(Math.sin(gait))*.012*p.s;
 if(p.love>0)bob+=Math.abs(Math.sin(t*9))*.02*p.s*(p.hop?2:1);
 p.up.position.y=base+bob;p.up.scale.y=1+Math.sin(t*2.2+p.seed)*.012;p.root.position.y=p.liftC;
 const wag=p.love>0?15:moving?7:2.2,amp=p.love>0?.7:p.mode==='sleep'?.03:p.tailAmp;p.tl.rotation.y=Math.sin(t*wag+p.seed)*amp;p.tl.rotation.z=p.tailUp?.25+Math.sin(t*1.3+p.seed)*.1:(p.love>0?-.5:0);
 p.hd.rotation.y=p.love>0?Math.sin(t*5)*.15:(p.mode==='idle'?Math.sin(t*.6+p.seed)*.4:0);p.hd.rotation.z=-.35*p.lie;
 const cl=(p.lie>.6||p.love>0)?.12:((t+p.seed)%4<.12?.12:1);p.eyes.forEach(e=>e.scale.y+=(cl-e.scale.y)*.5)}
function roam(g,dt,t){const u=g.userData,p=u.pet,{W,D}=S;let moving=false;p.timer-=dt;p.sndT-=dt;
 if(drag===g){p.mode='idle';p.lift=0;p.toBed=false;p.timer=2}
 else if(p.love>0){}
 else if(p.mode==='walk'){const dx=p.tx-g.position.x,dz=p.tz-g.position.z,d=Math.hypot(dx,dz);
  if(d<.1||p.timer<0){if(p.toBed){p.mode='sleep';p.timer=rn(10,20);p.lift=p.bedTop}else{p.mode='idle';p.timer=rn(1.5,5)}}
  else{let df=Math.atan2(-dz,dx)-g.rotation.y;df=Math.atan2(Math.sin(df),Math.cos(df));g.rotation.y+=df*Math.min(1,dt*5);
   if(Math.abs(df)<.8){const st=p.speed*dt,nx=g.position.x+dx/d*st,nz=g.position.z+dz/d*st;if(blockedAt(g,nx,nz)){p.mode='idle';p.timer=rn(.5,1.5);p.toBed=false}else{g.position.x=nx;g.position.z=nz;place(g);moving=true}}}}
 else if(p.mode==='sleep'){if(p.timer<=0){p.mode='idle';p.timer=rn(1,3);p.lift=0;p.toBed=false}}
 else if(p.timer<=0){const r=Math.random(),can=u.y<.05,b=can&&r<.2?bedFor(g):null;
  if(b){const bb=bbox(b);p.tx=(bb.min.x+bb.max.x)/2;p.tz=(bb.min.z+bb.max.z)/2;p.bedTop=Math.max(0,bb.max.y*.8);p.toBed=true;p.mode='walk';p.timer=14}
  else if(can&&r<.78){for(let i=0;i<10;i++){const x=rn(-1,1)*(W/2-.5),z=rn(-1,1)*(D/2-.5);if(!inFp(x,z,p.L*.3)||i==9){p.tx=x;p.tz=z;break}}p.toBed=false;p.mode='walk';p.timer=rn(7,12)}
  else if(r<.9){p.mode='sleep';p.toBed=false;p.timer=rn(6,12);p.lift=0}
  else p.timer=rn(2,5)}
 pose(p,dt,t,moving,t*Math.max(7,p.speed*22));
 if(p.sndT<=0){p.sndT=rn(15,40);if(p.lie<.5)voice(g,false)}}
const petClk=new THREE.Clock();let petWarn=0;
(function petLoop(){requestAnimationFrame(petLoop);const dt=Math.min(petClk.getDelta(),.05),t=petClk.elapsedTime;if((fpT-=dt)<=0){fpT=.6;rebuildFp()}
 items.forEach(g=>{const p=g.userData.pet;if(!p)return;if(p.love>0)p.love-=dt;try{if(p.update)p.update(g,dt,t);else roam(g,dt,t);if(g===cur)sel.setFromObject(g)}catch(e){if(petWarn++<3)console.warn(e)}})})();
